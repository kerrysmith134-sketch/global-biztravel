# 云上部署栈（ADR-0035）：在 VPS 上与 infra/docker/docker-compose.yml 同目录使用。
# 差异：绑定 127.0.0.1（公网只走反代/隧道）+ 部署 token + 免钥源全开。
# 启动：bash infra/deploy/bootstrap.sh
x-app-env: &app-env
  GBT_ENV: docker
  GBT_DATABASE_URL: postgresql+psycopg://gbt_app:gbt_app_pw@db:5432/gbt_os
  GBT_MIGRATION_DATABASE_URL: postgresql+psycopg://gbt_owner:gbt_owner_pw@db:5432/gbt_os
  GBT_DEV_AUTH: "true"
  GBT_DEV_ORG_ID: "11111111-1111-1111-1111-111111111111"
  GBT_DEV_USER_ID: "22222222-2222-2222-2222-222222222222"
  GBT_PLANNING_SOLVER: ortools
  GBT_LLM_PROVIDER: stub
  GBT_PUSH_PROVIDER: inapp
  GBT_WORKER_POLL_SECONDS: "2"
  # 免钥公开源（ADR-0033/0034）
  GBT_FX_PROVIDER: frankfurter
  GBT_WEATHER_PROVIDER: open-meteo
  GBT_FLIGHT_PROVIDER: opensky
  GBT_TRAVEL_PROVIDER: osrm
  # 部署 token（必须与 iOS APIClient.defaultApiToken 一致）
  GBT_API_TOKEN: "gbt-os-demo-2026"

services:
  db:
    build:
      context: .
      dockerfile: Dockerfile.pg
    image: gbt-os-postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: gbt_os
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    volumes:
      - ./initdb:/docker-entrypoint-initdb.d:ro
      - gbt_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d gbt_os"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  api:
    build:
      context: ../..
      dockerfile: services/api/Dockerfile
    image: gbt-os-api:local
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment: *app-env
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/v1/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  worker:
    image: gbt-os-api:local
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment: *app-env
    command: ["python", "-m", "app.workers.main"]

volumes:
  gbt_pg_data:
    name: gbt_os_pg_data
