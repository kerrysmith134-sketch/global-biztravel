# 本地开发数据库：PostgreSQL 16 + PostGIS 3.4 + pgvector
# 启动：  make db-up          （等价于 docker compose -f infra/docker/docker-compose.yml up -d --build）
# 连接：  postgresql://gbt_app:gbt_app_pw@localhost:55432/gbt_os          （应用角色，受 RLS 约束）
#         postgresql://gbt_owner:gbt_owner_pw@localhost:55432/gbt_os      （迁移角色，表 owner）
#
# 角色分层是 RLS 的前置条件（设计文档 v2.0 第 11.2 章）：
#   - 应用连接用 gbt_app（非表 owner、非超级用户）→ RLS 必然生效
#   - 迁移连接用 gbt_owner（表 owner）→ 配合 FORCE ROW LEVEL SECURITY 同样受策略约束
name: gbt-os

# API/Worker 共用配置。数据库主机名是 compose 服务名 db（不是宿主机的 localhost:55432）。
x-app-env: &app-env
  GBT_ENV: docker
  GBT_DATABASE_URL: postgresql+psycopg://gbt_app:gbt_app_pw@db:5432/gbt_os
  GBT_MIGRATION_DATABASE_URL: postgresql+psycopg://gbt_owner:gbt_owner_pw@db:5432/gbt_os
  GBT_DEV_AUTH: "true"
  GBT_DEV_ORG_ID: "11111111-1111-1111-1111-111111111111"
  GBT_DEV_USER_ID: "22222222-2222-2222-2222-222222222222"
  GBT_PLANNING_SOLVER: ortools
  GBT_LLM_PROVIDER: stub
  GBT_PUSH_PROVIDER: inapp
  # 免钥公开源全开（ADR-0033/0034，2026-11-12 TestFlight 测试栈）
  GBT_FX_PROVIDER: frankfurter        # FX 行情同步（ECB 免钥）
  GBT_WEATHER_PROVIDER: open-meteo    # 天气信号 + 指南实时天气
  GBT_FLIGHT_PROVIDER: opensky        # 航班信号（匿名速率，够测试用）
  GBT_TRAVEL_PROVIDER: osrm           # GROUND 段真实驾车时间（OSRM demo，失败自动回退大圆估算）
  # SMTP 邮件通道联调：切到 smtp 并加两行（容器内指向 mailpit 服务名）
  # GBT_PUSH_PROVIDER: smtp
  # GBT_SMTP_HOST: mailpit
  # GBT_SMTP_PORT: "1025"
  # GBT_SMTP_FROM: gbt-os@example.local
  GBT_WORKER_POLL_SECONDS: "2"

services:
  db:
    build:
      context: .
      dockerfile: Dockerfile.pg
    image: gbt-os-postgres:16
    container_name: zhi-tu-pg
    restart: unless-stopped
    ports:
      - "55432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: gbt_os
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    volumes:
      - ./initdb:/docker-entrypoint-initdb.d:ro
      - gbt_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d gbt_os"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  api:
    build:
      context: ../..
      dockerfile: services/api/Dockerfile
    image: gbt-os-api:local
    profiles: ["app"]
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment: *app-env
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/v1/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  worker:
    image: gbt-os-api:local
    profiles: ["app"]
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment: *app-env
    command: ["python", "-m", "app.workers.main"]

  # 开发 SMTP 收件池（ADR-0034）：开源 MailPit，网页界面看信件
  # （http://localhost:8025）。API/Worker 以 GBT_PUSH_PROVIDER=smtp +
  # GBT_SMTP_HOST=mailpit 指向它，邮件通道即可端到端联调，无需真实 SMTP 账号。
  mailpit:
    image: axllent/mailpit:latest
    profiles: ["app"]
    restart: unless-stopped
    ports:
      - "8025:8025"   # Web 界面
      - "1025:1025"   # SMTP

volumes:
  gbt_pg_data:
    name: gbt_os_pg_data