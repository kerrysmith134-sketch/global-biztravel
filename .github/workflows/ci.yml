name: ci

# Cancel superseded runs for the same PR/ref so Xcode runners validate the newest tree only.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-baseline-migration
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Generate and sync contracts (temporary bootstrap)
        if: github.event_name == 'pull_request'
        env:
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          make openapi
          make ios-contract-samples
          if ! git diff --quiet -- contracts/openapi.json contracts/openapi.yaml apps/ios/GlobalTravelOSTests/ContractSamples.generated.swift; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add contracts/openapi.json contracts/openapi.yaml apps/ios/GlobalTravelOSTests/ContractSamples.generated.swift
            git commit -m "chore(api): sync generated OpenAPI and iOS contract samples"
            git push origin "HEAD:refs/heads/${PR_HEAD_REF}"
          fi
      - name: Static + contract + docs
        run: |
          make lint
          make typecheck
          make contract-check
          make docs-check
          make ios-contract-check
      - name: Database
        run: make db-up && make migrate
      - name: Tests
        run: make test

  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: SwiftLint
        run: brew install swiftlint && make lint-ios
      # Temporary migration step: capture current repository-wide findings as a reviewed baseline.
      - name: Generate SwiftLint baseline artifact
        run: swiftlint --lenient
      - name: Verify baseline file
        run: test -s swiftlint-baseline.json
      - uses: actions/upload-artifact@v4
        with:
          name: swiftlint-baseline
          path: swiftlint-baseline.json
          if-no-files-found: error
      - name: Build
        run: make ios-build
      - name: Unit tests
        run: |
          xcodebuild -project apps/ios/GlobalTravelOS.xcodeproj -scheme GlobalTravelOS \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            -only-testing:GlobalTravelOSTests test
