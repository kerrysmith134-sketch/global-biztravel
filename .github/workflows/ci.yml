name: ci

# Versioned concurrency key: release stale H2.12 cleanup runners while still
# cancelling superseded runs for the same PR/ref on the current validation lane.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-h2-13-local-storage-closeout
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Static + contract + docs
        run: |
          make lint
          make typecheck
          make contract-check
          make docs-check
          make ios-contract-check
      # Produce downloadable generated contracts when any backend gate fails.
      # This makes contract drift diagnosable without committing generated files blindly.
      - name: Generate contract diagnostics after failure
        if: failure()
        run: |
          make openapi || true
          make ios-contract-samples || true
      - name: Upload generated contract diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: generated-contract-diagnostics
          path: |
            contracts/openapi.json
            contracts/openapi.yaml
            apps/ios/GlobalTravelOSTests/ContractSamples.generated.swift
          if-no-files-found: warn
      - name: Database
        run: |
          make db-up
          make migrate
          make check
      - name: Tests
        run: make test

  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: SwiftLint
        run: brew install swiftlint && make lint-ios
      # Temporary migration step: capture current repository-wide findings as a reviewed baseline.
      - name: Generate SwiftLint baseline artifact
        run: swiftlint --lenient
      - name: Verify baseline file
        run: test -s swiftlint-baseline.json
      - uses: actions/upload-artifact@v4
        with:
          name: swiftlint-baseline
          path: swiftlint-baseline.json
          if-no-files-found: error
      - name: Build
        run: make ios-build
      - name: Unit tests
        run: |
          xcodebuild -project apps/ios/GlobalTravelOS.xcodeproj -scheme GlobalTravelOS \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            -only-testing:GlobalTravelOSTests test
      - name: Compile real-backend UI automation tests
        run: |
          xcodebuild -project apps/ios/GlobalTravelOS.xcodeproj -scheme GlobalTravelOS \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            -only-testing:GlobalTravelOSUITests build-for-testing
