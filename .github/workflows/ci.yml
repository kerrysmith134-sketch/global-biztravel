name: ci

# Versioned concurrency key: release the superseded H2.11 runner while still
# cancelling superseded runs for the same PR/ref on this validation lane.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-h2-12-visit-follow-up
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Static + contract + docs
        run: |
          make lint
          make typecheck
          make contract-check
          make docs-check
          make ios-contract-check
      # Produce downloadable generated contracts when any backend gate fails.
      # This makes contract drift diagnosable without committing generated files blindly.
      - name: Generate contract diagnostics after failure
        if: failure()
        run: |
          make openapi || true
          make ios-contract-samples || true
      - name: Upload generated contract diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: generated-contract-diagnostics
          path: |
            contracts/openapi.json
            contracts/openapi.yaml
            apps/ios/GlobalTravelOSTests/ContractSamples.generated.swift
          if-no-files-found: warn
      - name: Database
        run: |
          make db-up
          make migrate
          make check
      - name: Tests
        run: make test

  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: SwiftLint
        run: brew install swiftlint && make lint-ios
      # Temporary migration step: capture current repository-wide findings as a reviewed baseline.
      - name: Generate SwiftLint baseline artifact
        run: swiftlint --lenient
      - name: Verify baseline file
        run: test -s swiftlint-baseline.json
      - uses: actions/upload-artifact@v4
        with:
          name: swiftlint-baseline
          path: swiftlint-baseline.json
          if-no-files-found: error
      - name: Build
        run: make ios-build
      - name: Unit tests
        run: |
          xcodebuild -project apps/ios/GlobalTravelOS.xcodeproj -scheme GlobalTravelOS \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            -only-testing:GlobalTravelOSTests test

  ios-acceptance:
    name: iOS UI acceptance (real PostgreSQL + API + Worker)
    needs: [backend, ios]
    # The simulator is macOS-native; use Intel macOS so Colima can host the Linux test stack.
    runs-on: macos-15-intel
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install Colima and Docker CLI
        run: |
          brew install colima docker docker-compose qemu
          mkdir -p ~/.docker/cli-plugins
          ln -sfn "$(brew --prefix)/opt/docker-compose/bin/docker-compose" ~/.docker/cli-plugins/docker-compose
          colima start --cpu 3 --memory 8 --disk 60 --vm-type=qemu
          docker info
          docker compose version
      - name: Install backend test dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r requirements-dev.txt
          cp .env.example .env
      - name: Start PostgreSQL, migrate, and seed real test data
        run: |
          make db-up
          make migrate
          make seed
      - name: Start API and Worker
        run: |
          make stack-up
          for attempt in {1..180}; do
            if curl -fsS http://127.0.0.1:8080/v1/health >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose -f infra/docker/docker-compose.yml --profile app logs --tail=200 api worker db
          exit 1
      - name: Preboot iPhone 16 simulator
        run: |
          set -euo pipefail
          device_id="$(xcrun simctl list devices available | awk -F '[()]' '$0 ~ /^[[:space:]]*iPhone 16 \(/ { print $2; exit }')"
          if [ -z "$device_id" ]; then
            xcrun simctl list devices available
            echo "iPhone 16 simulator is not installed on this runner"
            exit 1
          fi
          xcrun simctl boot "$device_id" || true
          xcrun simctl bootstatus "$device_id" -b
          xcrun simctl list devices | grep "$device_id"
      - name: Run complete iOS UI acceptance suite against real services
        run: |
          ONLY_TESTING=GlobalTravelOSUITests MAX_ATTEMPTS=1 STALL_SECONDS=900 \
            make ios-test IOS_DEST="platform=iOS Simulator,name=iPhone 16"
      - name: Upload iOS UI test logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-ui-acceptance-logs
          path: /tmp/ios-test-attempt-*.log
          if-no-files-found: ignore
      - name: Stop test stack
        if: always()
        run: |
          docker compose -f infra/docker/docker-compose.yml --profile app down -v || true
          colima stop || true
