name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Static + contract + docs
        run: |
          make lint
          make typecheck
          make contract-check
          make docs-check
      - name: Database
        run: make db-up && make migrate
      - name: Tests
        run: make test

  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: SwiftLint
        run: brew install swiftlint && make lint-ios
      - name: Build
        run: make ios-build
      - name: Unit tests
        run: |
          xcodebuild -project apps/ios/GlobalTravelOS.xcodeproj -scheme GlobalTravelOS \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            -only-testing:GlobalTravelOSTests test
