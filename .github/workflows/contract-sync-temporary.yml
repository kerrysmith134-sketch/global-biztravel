name: temporary-contract-sync

on:
  push:
    branches:
      - "feat/sprint-h1.3-evidence-insights"
  pull_request:
    branches:
      - "feat/sprint-h1.2-market-workspace-on-research-plan"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Generate contracts and samples
        run: |
          make openapi
          make ios-contract-samples
      - name: Commit generated contracts
        run: |
          TARGET_BRANCH="${{ github.head_ref || github.ref_name }}"
          git fetch origin "refs/heads/${TARGET_BRANCH}:refs/remotes/origin/${TARGET_BRANCH}"
          git rebase "origin/${TARGET_BRANCH}"
          if ! git diff --quiet -- contracts/openapi.json contracts/openapi.yaml apps/ios/GlobalTravelOSTests/ContractSamples.generated.swift; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+actions-bot@users.noreply.github.com"
            git add contracts/openapi.json contracts/openapi.yaml apps/ios/GlobalTravelOSTests/ContractSamples.generated.swift
            git commit -m "chore(api): sync generated OpenAPI and iOS contract samples"
            git push origin "HEAD:refs/heads/${TARGET_BRANCH}"
          fi
