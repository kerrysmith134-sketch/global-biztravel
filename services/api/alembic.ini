[alembic]
script_location = %(here)s/migrations
prepend_sys_path = %(here)s
# 迁移连接串由 migrations/env.py 从 GBT_MIGRATION_DATABASE_URL 读取（不在本文件里写死，
# 避免把数据库凭据写进版本管理的配置）。sqlalchemy.url 留空即可。
sqlalchemy.url =
file_template = %%(rev)s_%%(slug)s
timezone = UTC

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S