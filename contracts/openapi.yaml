openapi: 3.1.0
info:
  title: 全球商务出行智能体 API
  summary: Global Business Travel OS —— 主动式商务出行规划与执行平台
  description: 服务端契约。核心不变式：计划不可变、操作可审计、后台任务可恢复、结果可验证；LLM 负责理解与解释，优化算法负责计算，独立验证器负责检查——任何单一模型都不宣布行程可行。
  version: 2.0.0
paths:
  /v1/health:
    get:
      tags:
      - health
      summary: 健康检查
      operationId: health_v1_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthRead'
  /v1/trips:
    post:
      tags:
      - trips
      summary: 创建出行
      operationId: create_trip_v1_trips_post
      parameters:
      - name: Idempotency-Key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Idempotency-Key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TripCreate'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TripRead'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    get:
      tags:
      - trips
      summary: 出行列表
      operationId: list_trips_v1_trips_get
      parameters:
      - name: status
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Status
      - name: limit
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
            minimum: 1
          - type: 'null'
          title: Limit
      - name: cursor
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Cursor
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Page_TripRead_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/trips/{trip_id}:
    get:
      tags:
      - trips
      summary: 出行详情
      operationId: get_trip_v1_trips__trip_id__get
      parameters:
      - name: trip_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Trip Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TripRead'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    patch:
      tags:
      - trips
      summary: 更新出行
      description: 更新出行。可带 ``If-Match`` 做乐观并发：版本不符返回 412，提示客户端重取。
      operationId: update_trip_v1_trips__trip_id__patch
      parameters:
      - name: trip_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Trip Id
      - name: If-Match
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: If-Match
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TripUpdate'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TripRead'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/trips/{trip_id}/visits:
    get:
      tags:
      - trips
      summary: 出行下的拜访列表
      operationId: list_trip_visits_v1_trips__trip_id__visits_get
      parameters:
      - name: trip_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Trip Id
      - name: status
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Status
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/VisitRead'
                title: Response List Trip Visits V1 Trips  Trip Id  Visits Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - trips
      summary: 在出行下新增拜访
      description: 新增拜访会递增 Trip 版本号：既有计划立刻失效，避免"基于旧输入的计划"被当成当前有效。
      operationId: create_trip_visit_v1_trips__trip_id__visits_post
      parameters:
      - name: trip_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Trip Id
      - name: Idempotency-Key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Idempotency-Key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VisitCreate'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VisitRead'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/trips/{trip_id}/hold:
    post:
      tags:
      - trips
      summary: 暂停出行
      operationId: hold_trip_v1_trips__trip_id__hold_post
      parameters:
      - name: trip_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Trip Id
      - name: Idempotency-Key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Idempotency-Key
      - name: If-Match
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: If-Match
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TripRead'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/trips/{trip_id}/resume:
    post:
      tags:
      - trips
      summary: 恢复出行
      operationId: resume_trip_v1_trips__trip_id__resume_post
      parameters:
      - name: trip_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Trip Id
      - name: Idempotency-Key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Idempotency-Key
      - name: If-Match
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: If-Match
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TripRead'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/trips/{trip_id}/complete:
    post:
      tags:
      - trips
      summary: 完成出行
      operationId: complete_trip_v1_trips__trip_id__complete_post
      parameters:
      - name: trip_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Trip Id
      - name: Idempotency-Key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Idempotency-Key
      - name: If-Match
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: If-Match
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TripRead'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/visits/{visit_id}/briefing:
    get:
      tags:
      - visits
      summary: 拜访前简报：客户、地点、目标、历史、跟进与记忆
      operationId: get_visit_briefing_v1_visits__visit_id__briefing_get
      parameters:
      - name: visit_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Visit Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VisitBriefingRead'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/visits/{visit_id}:
    patch:
      tags:
      - visits
      summary: 更新拜访
      operationId: update_visit_v1_visits__visit_id__patch
      parameters:
      - name: visit_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Visit Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VisitUpdate'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VisitRead'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - visits
      summary: 删除拜访
      operationId: delete_visit_v1_visits__visit_id__delete
      parameters:
      - name: visit_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Visit Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TripRead'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/visits/{visit_id}/records:
    post:
      tags:
      - visits
      summary: 提交现场拜访记录（LWW，幂等）
      description: '记录现场结果。``client_record_id`` 本身已是幂等键；``Idempotency-Key`` 再保证整次

        HTTP 重试不产生第二次副作用。两者都带时以 ``client_record_id`` 为准——它跨设备重启仍在。'
      operationId: submit_visit_record_v1_visits__visit_id__records_post
      parameters:
      - name: visit_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Visit Id
      - name: Idempotency-Key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Idempotency-Key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VisitRecordCreate'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VisitRecordRead'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/visits/{visit_id}/minutes:draft:
    post:
      tags:
      - visits
      summary: 生成会议纪要与跟进任务草稿（不发送）
      description: '基于最近一条生效的现场记录起草纪要。草稿写入 ``llm_invocations`` 并返回其 id，

        任何后续动作（发送、建任务）都必须由人确认后走业务接口。'
      operationId: draft_meeting_minutes_v1_visits__visit_id__minutes_draft_post
      parameters:
      - name: visit_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Visit Id
      - name: Idempotency-Key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Idempotency-Key
      requestBody:
        content:
          application/json:
            schema:
              anyOf:
              - $ref: '#/components/schemas/MinutesDraftRequest'
              - type: 'null'
              title: Payload
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MinutesDraftRead'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/visits/{visit_id}/minutes:jobs:
    post:
      tags:
      - visits
      summary: 异步生成会议纪要草稿（返回 job_id 轮询）
      operationId: create_minutes_job_v1_visits__visit_id__minutes_jobs_post
      parameters:
      - name: visit_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Visit Id
      - name: Idempotency-Key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Idempotency-Key
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MinutesJobAcceptedRead'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/trips/{trip_id}/visa-cases:
    get:
      tags:
      - visa
      summary: 出行的签证案件列表
      operationId: list_visa_cases_v1_trips__trip_id__visa_cases_get
      parameters:
      - name: trip_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Trip Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/VisaCaseRead'
                title: Response List Visa Cases V1 Trips  Trip Id  Visa Cases Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - visa
      summary: 按目的国创建签证案件（幂等；缺省用出行国家）
      operationId: create_visa_cases_v1_trips__trip_id__visa_cases_post
      parameters:
      - name: trip_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Trip Id
      - name: Idempotency-Key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Idempotency-Key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VisaCaseCreate'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/VisaCaseRead'
                title: Response Create Visa Cases V1 Trips  Trip Id  Visa Cases Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/visa-cases/{case_id}:
    patch:
      tags:
      - visa
      summary: 更新签证案件状态/清单/备注
      operationId: update_visa_case_v1_visa_cases__case_id__patch
      parameters:
      - name: case_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Case Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VisaCaseUpdate'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VisaCaseRead'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/trips/{trip_id}/entry-assessments:
    get:
      tags:
      - visa
      summary: 出行的入境要求评估快照
      operationId: list_entry_assessments_v1_trips__trip_id__entry_assessments_get
      parameters:
      - name: trip_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Trip Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EntryAssessmentRead'
                title: Response List Entry Assessments V1 Trips  Trip Id  Entry Assessments
                  Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/trips/{trip_id}/entry-assessments:refresh:
    post:
      tags:
      - visa
      summary: 刷新入境要求评估（离线目录，标注需人工复核）
      operationId: refresh_entry_assessments_v1_trips__trip_id__entry_assessments_refresh_post
      parameters:
      - name: trip_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Trip Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EntryAssessmentRead'
                title: Response Refresh Entry Assessments V1 Trips  Trip Id  Entry
                  Assessments Refresh Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/trips/{trip_id}/imports:parse:
    post:
      tags:
      - imports
      summary: 上传并解析客户名单（只读预览）
      description: 解析上传的 Excel 并返回逐行预览与校验报告。**此调用不创建任何客户或拜访。**
      operationId: parse_import_v1_trips__trip_id__imports_parse_post
      parameters:
      - name: trip_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Trip Id
      - name: Idempotency-Key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Idempotency-Key
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_parse_import_v1_trips__trip_id__imports_parse_post'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportParseRead'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/trips/{trip_id}/imports:confirm:
    post:
      tags:
      - imports
      summary: 确认导入（按勾选行号落库）
      description: '把用户勾选的行真正落库。``accepted_row_numbers`` 为空表示"接受全部有效行"。


        重复确认同一批次返回 409 ``IMPORT_ALREADY_CONFIRMED``——落库不是幂等操作，

        必须让客户端知道"这次没有产生新数据，是第二次提交"。'
      operationId: confirm_import_v1_trips__trip_id__imports_confirm_post
      parameters:
      - name: trip_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Trip Id
      - name: Idempotency-Key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Idempotency-Key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImportConfirmRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportConfirmRead'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/imports/{import_id}:
    get:
      tags:
      - imports
      summary: 导入批次详情（刷新预览页）
      operationId: get_import_v1_imports__import_id__get
      parameters:
      - name: import_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Import Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportParseRead'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/trips/{trip_id}/local-guide:
    get:
      tags:
      - local-guide
      summary: 按出行国家与拜访城市组装的当地指南（离线目录）
      operationId: get_local_guide_v1_trips__trip_id__local_guide_get
      parameters:
      - name: trip_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Trip Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocalGuideRead'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/integrations/signals:
    post:
      tags:
      - integrations
      summary: 接入外部信号（供应商回调或轮询结果）
      operationId: ingest_signal_v1_integrations_signals_post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExternalSignalCreate'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExternalSignalRead'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    get:
      tags:
      - integrations
