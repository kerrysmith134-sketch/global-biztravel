          title: Against
        description: 对比基准（旧）计划版本 id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanVersionDiffRead'
        '422':
          description: Validation Error
