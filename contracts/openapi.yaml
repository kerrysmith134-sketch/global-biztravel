  /v1/trips/{trip_id}/plans/{plan_version_id}:activate:
    post:
      tags:
      - plans
      summary: '激活某一版计划（幂等；If-Match: version）'
      description: '把某一份计划版本扶正为出行生效计划（把旧的生效版本标为 ``SUPERSEDED``）。


        与 ``plans:generate`` 的差别：**激活是同步事务，不是异步任务**。改的是状态而非算结果，

        没有不可预期的耗时，因此不排队、不返回 202，用户点完立刻看到出行进入 ``ACTIVE``。

        全部判定（``If-Match`` 乐观并发、计划陈旧、重复激活、并发抢先）都在

        :func:`plan_change_service.activate_plan_version` 里，路由只做权限与组装。


        ``If-Match`` 建议带上：不带则退化为"最后写入者胜"，并发的两个激活会被行锁串行化，

        后者拿到 409。带上则两者之一必然先拿到 412 而重取，语义更清晰。'
      operationId: activate_plan_v1_trips__trip_id__plans__plan_version_id__activate_post
      parameters:
      - name: trip_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Trip Id
      - name: plan_version_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Plan Version Id
      - name: Idempotency-Key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Idempotency-Key
      - name: If-Match
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: If-Match
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanActivationRead'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
