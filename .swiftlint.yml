# SwiftLint 基线（PRD §8）。规则保持克制：先拦住明确的问题，不做风格大扫除。
included:
  - apps/ios/GlobalTravelOS
  - apps/ios/GlobalTravelOSTests
  - apps/ios/GlobalTravelOSUITests
write_baseline: .swiftlint-baseline.json
excluded:
  - apps/ios/build
line_length:
  warning: 140
  error: 200
  ignores_comments: true
  ignores_urls: true
file_length:
  warning: 600
  error: 1000
type_body_length:
  warning: 400
  error: 600
function_body_length:
  warning: 80
  error: 140
cyclomatic_complexity:
  warning: 20
  error: 30
large_tuple:
  warning: 3
  error: 4
disabled_rules:
  - todo
  - trailing_comma
  - multiple_closures_with_trailing_closure
  - trailing_newline
  - implicit_optional_initialization
  - unneeded_synthesized_initializer
  - identifier_name
function_parameter_count:
  warning: 10
  error: 12
